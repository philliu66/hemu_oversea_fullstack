services:
  postgres:
    image: postgres:16
    container_name: hemu_oversea_fastapi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hemu_oversea_fastapi
    ports:
      - "5500:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hemu_oversea_fastapi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: